# 젤리 워즈 전용 서버.
#
#   cd server
#   docker compose up --build
#
# 포트 번호는 같은 폴더의 .env 에 JELLY_PORT 로 적는다. 기본값은 없다.

services:
  jelly-server:
    build: .
    container_name: jelly-wars-server
    environment:
      # .env 의 JELLY_PORT 를 그대로 넘긴다. 비어 있으면 컨테이너가 즉시 종료된다.
      JELLY_PORT: ${JELLY_PORT:?server/.env 에 JELLY_PORT 를 지정하세요}
    ports:
      # ENet 은 UDP 다. /udp 를 빼면 서버는 떠 있는데 아무도 접속하지 못한다.
      - "${JELLY_PORT:?server/.env 에 JELLY_PORT 를 지정하세요}:${JELLY_PORT}/udp"
    volumes:
      # 프로젝트 폴더(이 파일의 상위)를 읽기 전용으로 마운트한다.
      # 컨테이너가 /game 으로 복사해서 쓰므로 호스트 폴더는 절대 수정되지 않는다.
      - ..:/src:ro
    restart: unless-stopped
