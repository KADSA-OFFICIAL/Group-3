; 배포본 프리셋. **플레이어용과 관전용 두 개**다 (이슈 #180).
;
; 관전 프리셋에는 custom_features="observer" 가 박혀 있어 그 실행 파일은
; OS.has_feature("observer") 가 참이 되고, Lobby 가 그것을 보고 관전으로만 접속한다.
; 만드는 방법과 배포 방법은 docs/build.md 를 볼 것.
;
; 산출물(build/*.exe, *.pck)은 .gitignore 로 빠지고 이 파일만 커밋한다 —
; 빌드 방법이 사람마다 달라지지 않게 하려는 것이다.

