// Gradle 빌드(AAB)에서 Google Maven 저장소 주소를 dl-ssl.google.com 으로 바꾼다 (#478).
//
// 이 컴퓨터가 쓰는 네트워크는 dl.google.com 을 막는다(이름은 풀리고 443 연결이 거부된다).
// `google()` 저장소와 maven.google.com 은 결국 dl.google.com 으로 가므로 Gradle 이 의존성을
// 하나도 못 받는다. dl-ssl.google.com 은 같은 파일을 주는 Google 의 공식 별칭이다.
//
// 저장소 파일을 고치지 않고 GRADLE_USER_HOME/init.d 에 넣어 쓴다 — docs/build.md 참고.
// 막히지 않은 네트워크에서는 없어도 된다.

def useDlSsl = { RepositoryHandler repos ->
    repos.withType(MavenArtifactRepository).configureEach { repo ->
        def url = repo.url.toString()
        if (url.contains("://dl.google.com/") || url.contains("://maven.google.com")) {
            repo.url = "https://dl-ssl.google.com/dl/android/maven2/"
        }
    }
}

beforeSettings { settings ->
    useDlSsl(settings.pluginManagement.repositories)
    useDlSsl(settings.dependencyResolutionManagement.repositories)
}

allprojects {
    useDlSsl(buildscript.repositories)
    useDlSsl(repositories)
}
